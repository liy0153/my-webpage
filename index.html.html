<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이인영 | 개인 홈페이지</title>
  <style>
    /* ===== 색상 변수 ===== */
    :root {
      --ink: #1f2d2b;
      --ink-soft: #52605d;
      --paper: #f7f8f5;
      --card: #ffffff;
      --line: #d9dfd9;
      --accent: #2f6f62;
      --accent-light: #dcebe6;
      --highlight: #f2d37a;
    }

    /* ===== 공통 스타일 (타입 선택자) ===== */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ink);
      background: var(--paper);
    }
    h1, h2, h3 { line-height: 1.3; margin: 0 0 0.6em; }
    h1 { font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -0.02em; }
    h2 { font-size: 1.5rem; padding-bottom: 0.4rem; border-bottom: 3px solid var(--highlight); display: inline-block; }
    h3 { font-size: 1.15rem; }
    p, li { color: var(--ink-soft); margin: 0 0 0.6em; }
    ul { padding-left: 1.2rem; margin: 0; }
    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }

    /* ===== 레이아웃 보조 (div) ===== */
    .container { width: min(100% - 2.5rem, 960px); margin-inline: auto; }

    /* ===== 머리말: 이름 + 소개 문구 ===== */
    #site-header { background: var(--accent); color: #fff; padding: 4.5rem 0 3.5rem; }
    #site-header h1 { color: #fff; }
    #site-header p { color: var(--accent-light); font-size: 1.15rem; max-width: 36ch; }

    /* ===== 메뉴 ===== */
    #site-nav { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
    #site-nav ul { list-style: none; display: flex; gap: 0.25rem; padding: 0; margin: 0; overflow-x: auto; }
    #site-nav a { display: block; padding: 0.9rem 1rem; color: var(--ink); text-decoration: none; font-weight: 600; white-space: nowrap; }
    #site-nav a:hover { background: var(--accent-light); }

    /* ===== 본문 영역 ===== */
    main { padding: 1rem 0 3rem; }
    main > section { padding: 2.5rem 0; border-bottom: 1px solid var(--line); }
    main > section:last-child { border-bottom: none; }

    /* ===== 관심사 / 활동 목록 ===== */
    .tag-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .tag-list li { margin: 0; padding: 0.35rem 1rem; background: var(--accent-light); color: var(--accent); border-radius: 999px; font-weight: 600; }

    /* ===== 프로젝트 목록 (반복 항목: class) ===== */
    .project-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
    .project-item { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--accent); padding: 1.25rem 1.5rem; }
    .project-item a { font-weight: 700; }

    /* ===== 꼬리말 ===== */
    #site-footer { background: var(--ink); padding: 2rem 0; }
    #site-footer p { color: #b9c4c1; margin: 0; font-size: 0.9rem; }
    #site-footer a { color: var(--highlight); }

    /* ===== 반응형: 스마트폰 ===== */
    @media (max-width: 640px) {
      #site-header { padding: 3rem 0 2.5rem; }
      .project-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- [SECTION: site-header] 이름 + 소개 문구 -->

  <main>

        <p>연락처: <a href="mailto:dlsdud0153@naver.com">dlsdud0153@naver.com</a></p>

      <!-- [SECTION: sec-interests] 관심사 -->
      <section id="sec-interests">

        </div>
      </section>

    </div>
  </main>

  <!-- [SECTION: site-footer] 제작 정보 -->
  <footer id="site-footer">
    <div class="container">
      <p>제작: 이인영 | 공주대학교 문헌정보교육과 | 문의: <a href="mailto:dlsdud0153@naver.com">dlsdud0153@naver.com</a></p>
    </div>

</body>
</html>
