<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>운동 체크리스트</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동기록">
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d2420;--sub:#6b756f;--ac:#2f9e6f;--ac2:#dff3e9;--bd:#e3e7e4;--dn:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--tx:#e8eeea;--sub:#93a09a;--ac:#3fbf8a;--ac2:#1f3a2e;--bd:#2a332e;--dn:#ef6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614;--card:#1b211e;--tx:#e8eeea;--sub:#93a09a;--ac:#3fbf8a;--ac2:#1f3a2e;--bd:#2a332e;--dn:#ef6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.ico{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 8px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.sum{font-size:22px;font-weight:700}
.sub{color:var(--sub);font-size:13px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:#fff;font-size:16px;line-height:1;flex:none;display:grid;place-items:center}
.item.done .chk{background:var(--ac);border-color:var(--ac)}
.item.done .nm{color:var(--sub);text-decoration:line-through}
.nm{flex:1;word-break:break-all}
.val{width:72px;text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--sub)}
.d{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--bg);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.d.e{background:none;pointer-events:none}
.d.t{border-color:var(--ac)}
.d.s{outline:2px solid var(--ac)}
.d b{width:60%;height:4px;border-radius:3px;background:var(--bd);overflow:hidden;display:block}
.d b i{display:block;height:100%;background:var(--ac)}
.chart{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px;overflow-x:auto}
.chart div{flex:1;min-width:6px;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.chart div.z{background:var(--bd)}
.st{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add input{flex:1;min-width:120px}
</style>
</head>
<body>
<main>
<h1>💪 운동 체크리스트</h1>

<section class="card">
  <div class="sub" id="dateLabel"></div>
  <div class="sum" id="sum"></div>
  <div class="bar"><i id="prog"></i></div>
</section>

<section class="card">
  <h2>운동 목록</h2>
  <div id="list"></div>
  <div class="add">
    <input id="newName" placeholder="운동 이름 (예: 달리기)" maxlength="20">
    <select id="newUnit" aria-label="단위">
      <option value="">체크만</option><option>개</option><option>km</option><option>분</option><option>kg</option><option>세트</option>
    </select>
    <button class="btn" id="addBtn">추가</button>
  </div>
</section>

<section class="card">
  <div class="row">
    <button class="ico" id="prev" aria-label="이전 달">◀</button>
    <div class="sp" style="text-align:center;font-weight:600" id="monthLabel"></div>
    <button class="ico" id="next" aria-label="다음 달">▶</button>
  </div>
  <div class="cal" id="cal" style="margin-top:8px"></div>
</section>

<section class="card">
  <h2>월간 통계</h2>
  <div class="sub">일별 완료 개수</div>
  <div class="chart" id="chart"></div>
  <div id="stats" style="margin-top:12px"></div>
</section>

<p class="sub" style="text-align:center">기록은 이 기기의 브라우저에 자동 저장돼요. 홈 화면에 추가하면 앱처럼 쓸 수 있어요.</p>
</main>
<script>
(function(){
var KEY='workout-v1',S={ex:[],logs:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.ex&&p.logs)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pad(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var todayStr=ds(new Date()),sel=todayStr,now=new Date(),vy=now.getFullYear(),vm=now.getMonth();
function $(id){return document.getElementById(id)}
function log(date,id){var l=S.logs[date]||(S.logs[date]={});return l[id]||(l[id]={done:false,val:''})}
function peek(date,id){var l=S.logs[date];return l&&l[id]}
function doneCount(date){var n=0;S.ex.forEach(function(e){var r=peek(date,e.id);if(r&&r.done)n++});return n}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function renderToday(){
  var w=['일','월','화','수','목','금','토'],d=new Date(sel+'T00:00:00');
  $('dateLabel').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+w[d.getDay()]+')'+(sel===todayStr?' · 오늘':'');
  var n=doneCount(sel),t=S.ex.length;
  $('sum').textContent=t?('완료 '+n+' / '+t):'운동을 추가해 보세요';
  $('prog').style.width=(t?n/t*100:0)+'%';
  var L=$('list');L.textContent='';
  if(!t){L.appendChild(el('div','sub','아직 등록된 운동이 없어요.'));return}
  S.ex.forEach(function(e){
    var r=peek(sel,e.id)||{done:false,val:''};
    var it=el('div','item'+(r.done?' done':''));
    var c=el('button','chk',r.done?'✓':'');c.setAttribute('aria-label',e.name+' 완료 체크');
    c.onclick=function(){var x=log(sel,e.id);x.done=!x.done;save();renderAll()};
    it.appendChild(c);it.appendChild(el('div','nm',e.name));
    if(e.unit){
      var i=el('input','val');i.type='number';i.min='0';i.step='any';i.inputMode='decimal';i.placeholder='0';i.value=r.val;
      i.oninput=function(){var x=log(sel,e.id);x.val=i.value;save();renderStats()};
      i.onchange=renderAll;
      it.appendChild(i);it.appendChild(el('span','sub',e.unit));
    }
    var x=el('button','ico','✕');x.setAttribute('aria-label',e.name+' 삭제');
    x.onclick=function(){if(confirm('"'+e.name+'" 항목을 삭제할까요?')){S.ex=S.ex.filter(function(q){return q.id!==e.id});save();renderAll()}};
    it.appendChild(x);L.appendChild(it);
  });
}
function renderCal(){
  $('monthLabel').textContent=vy+'년 '+(vm+1)+'월';
  var C=$('cal');C.textContent='';
  ['일','월','화','수','목','금','토'].forEach(function(w){C.appendChild(el('div','h',w))});
  var first=new Date(vy,vm,1).getDay(),days=new Date(vy,vm+1,0).getDate();
  for(var i=0;i<first;i++)C.appendChild(el('div','d e'));
  for(var d=1;d<=days;d++){
    (function(d){
      var s=vy+'-'+pad(vm+1)+'-'+pad(d),b=el('button','d'+(s===todayStr?' t':'')+(s===sel?' s':''),d);
      var n=doneCount(s),t=S.ex.length,bar=el('b'),f=el('i');f.style.width=(t?Math.min(100,n/t*100):0)+'%';bar.appendChild(f);b.appendChild(bar);
      b.onclick=function(){sel=s;renderAll()};C.appendChild(b);
    })(d);
  }
}
function renderStats(){
  var days=new Date(vy,vm+1,0).getDate(),max=Math.max(1,S.ex.length),CH=$('chart');CH.textContent='';
  for(var d=1;d<=days;d++){
    var s=vy+'-'+pad(vm+1)+'-'+pad(d),n=doneCount(s),b=el('div',n?'':'z');
    b.style.height=(n?Math.max(8,n/max*100):2)+'%';b.title=d+'일: '+n+'개';CH.appendChild(b);
  }
  var T=$('stats');T.textContent='';
  if(!S.ex.length){T.appendChild(el('div','sub','통계가 여기에 표시돼요.'));return}
  S.ex.forEach(function(e){
    var dn=0,sum=0;
    for(var d=1;d<=days;d++){var r=peek(vy+'-'+pad(vm+1)+'-'+pad(d),e.id);if(r&&r.done)dn++;if(r&&r.val)sum+=parseFloat(r.val)||0}
    var row=el('div','st');row.appendChild(el('span','',e.name));
    row.appendChild(el('span','sub',dn+'일 완료'+(e.unit?' · 누적 '+Math.round(sum*100)/100+e.unit:'')));
    T.appendChild(row);
  });
}
function renderAll(){renderToday();renderCal();renderStats()}

$('addBtn').onclick=function(){
  var n=$('newName').value.trim();if(!n)return;
  S.ex.push({id:Date.now().toString(36),name:n,unit:$('newUnit').value});
  $('newName').value='';save();renderAll();
};
$('newName').onkeydown=function(e){if(e.key==='Enter')$('addBtn').click()};
$('prev').onclick=function(){vm--;if(vm<0){vm=11;vy--}renderAll()};
$('next').onclick=function(){vm++;if(vm>11){vm=0;vy++}renderAll()};
renderAll();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
