<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주사위 확률 실험실</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef0; --panel:#ffffff; --ink:#1a2830; --sub:#5b6b74; --line:#d3dde1;
  --bar:#2d6a8a; --bar-hi:#e0932b; --theory:#c8402b; --btn:#1f5b45; --btn-ink:#fff; --btn2:#e3ebee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171b; --panel:#192227; --ink:#e5edf0; --sub:#93a4ad; --line:#2c3a41;
    --bar:#6fb3d2; --bar-hi:#f0b050; --theory:#ff7a63; --btn:#3d9a76; --btn-ink:#0c1612; --btn2:#26343b;
  }
}
:root[data-theme="dark"]{
  --bg:#10171b; --panel:#192227; --ink:#e5edf0; --sub:#93a4ad; --line:#2c3a41;
  --bar:#6fb3d2; --bar-hi:#f0b050; --theory:#ff7a63; --btn:#3d9a76; --btn-ink:#0c1612; --btn2:#26343b;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.6rem;margin:0 0 2px;letter-spacing:-.02em}
.lead{margin:0 0 16px;color:var(--sub);font-size:.95rem}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage{position:relative;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#2b7a5c 0%,#1d5a43 60%,#164634 100%);height:min(56vw,400px);min-height:260px}
.stage canvas{display:block;width:100%;height:100%}
.badge{position:absolute;left:12px;top:10px;color:#f1f6ee;font-size:.9rem;background:rgba(0,0,0,.28);padding:4px 10px;border-radius:999px}
.badge b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.ctrl{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-weight:500;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
button.alt{background:var(--btn2);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--bar-hi);outline-offset:2px}
.custom{display:flex;gap:6px;align-items:center}
input[type=number]{font:inherit;width:96px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.msg{min-height:1.4em;margin:8px 0 0;font-size:.85rem;color:var(--sub)}
h2{font-size:1.05rem;margin:0 0 10px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.total b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:500;font-size:.82rem}
tfoot td{font-weight:700;border-bottom:0}
.pos{color:var(--theory)} .neg{color:var(--bar)}
.chart{margin-top:14px}
.plot{position:relative;height:210px;margin-left:34px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:0 8px}
.col{position:relative;height:100%}
.bar{position:absolute;left:12%;right:12%;bottom:0;height:0;background:var(--bar);border-radius:4px 4px 0 0;transition:height .18s linear}
.bar.hi{background:var(--bar-hi)}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.75rem;white-space:nowrap;font-variant-numeric:tabular-nums;padding-bottom:2px}
.theory{position:absolute;left:0;right:0;border-top:2px dashed var(--theory);pointer-events:none}
.theory em{position:absolute;right:2px;bottom:2px;font-style:normal;font-size:.72rem;color:var(--theory)}
.ylab{position:absolute;left:-34px;width:30px;text-align:right;font-size:.7rem;color:var(--sub);transform:translateY(50%)}
.xlab{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:4px 8px 0 42px;text-align:center;font-size:.85rem;color:var(--sub)}
.note{font-size:.8rem;color:var(--sub);margin:10px 0 0}
.prog{margin-top:12px;height:12px;border-radius:999px;background:var(--btn2);overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--btn);border-radius:999px}
.prog-txt{margin-top:6px;font-size:.85rem;color:var(--sub);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
@media (prefers-reduced-motion: reduce){.bar{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>주사위 확률 실험실</h1>
  <p class="lead">주사위를 수천 번 굴려 보고, 눈의 출현 빈도가 이론값(약 16.67%)에 가까워지는 과정을 확인해 보세요.</p>
  <div class="grid">
    <section class="card" aria-label="3D 주사위와 실행 버튼">
      <div class="stage" id="stage">
        <div class="badge" aria-live="polite">최근 결과 <b id="last">–</b></div>
      </div>
      <div class="ctrl">
        <button id="b1">1회 굴리기</button>
        <button id="b10">10회</button>
        <button id="b100">100회</button>
        <span class="custom">
          <input type="number" id="n" min="1" max="100000" value="1000" inputmode="numeric" aria-label="사용자 지정 횟수">
          <button id="bn">굴리기</button>
        </span>
        <button id="reset" class="alt">초기화</button>
      </div>
      <div class="prog" id="prog" role="progressbar" aria-label="실행 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="prog-fill" id="pf"></div></div>
      <div class="prog-txt"><span id="pt">대기 중</span><span id="pp">0%</span></div>
      <p class="msg" id="msg" role="status">횟수를 골라 주사위를 굴려 보세요. 사용자 지정은 1~100,000회까지 가능합니다.</p>
    </section>

    <section class="card" aria-label="집계 결과">
      <div class="total"><h2 style="margin:0">누적 집계</h2><span>전체 실행 <b id="total">0</b>회</span></div>
      <div class="scroll">
      <table>
        <thead><tr><th>눈</th><th>출현 횟수</th><th>비율(%)</th><th>이론값과 차이</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td>합계</td><td id="fc">0</td><td id="fp">0.00</td><td>이론값 16.67</td></tr></tfoot>
      </table>
      </div>
      <div class="chart">
        <h2>눈별 출현 비율 (%)</h2>
        <div class="plot" id="plot">
          <div class="cols" id="cols"></div>
          <div class="theory" id="theory"><em>이론값 16.67%</em></div>
        </div>
        <div class="xlab"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
      </div>
      <p class="note">막대 위 숫자는 비율이며, 가장 많이 나온 눈은 주황색으로 표시됩니다. 점선은 이론 확률입니다.</p>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var counts=[0,0,0,0,0,0], total=0, job=null;
  var $=function(id){return document.getElementById(id)};

  /* ---------- Table & chart DOM ---------- */
  var rows=$('rows'), cols=$('cols'), rowEls=[], barEls=[], barLbl=[];
  for(var i=0;i<6;i++){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+(i+1)+'</td><td></td><td></td><td></td>';
    rows.appendChild(tr); rowEls.push(tr.children);
    var col=document.createElement('div'); col.className='col';
    var bar=document.createElement('div'); bar.className='bar';
    var sp=document.createElement('span'); bar.appendChild(sp);
    col.appendChild(bar); cols.appendChild(col); barEls.push(bar); barLbl.push(sp);
  }
  var plot=$('plot');
  var ylabs=[];
  for(var k=0;k<=4;k++){var y=document.createElement('div');y.className='ylab';plot.appendChild(y);ylabs.push(y);}

  function fmt(n){return n.toLocaleString('ko-KR')}
  function render(){
    var pcts=counts.map(function(c){return total?c*100/total:0});
    var mx=Math.max.apply(null,pcts), scale=Math.max(25,Math.ceil((mx+3)/5)*5);
    var top=Math.max.apply(null,counts);
    for(var i=0;i<6;i++){
      var d=pcts[i]-100/6;
      rowEls[i][1].textContent=fmt(counts[i]);
      rowEls[i][2].textContent=pcts[i].toFixed(2);
      rowEls[i][3].textContent=total?((d>=0?'+':'')+d.toFixed(2)+'%p'):'–';
      rowEls[i][3].className=total?(d>=0?'pos':'neg'):'';
      barEls[i].style.height=(pcts[i]/scale*100)+'%';
      barEls[i].className='bar'+(total&&counts[i]===top?' hi':'');
      barLbl[i].textContent=total?pcts[i].toFixed(1):'';
    }
    $('total').textContent=fmt(total); $('fc').textContent=fmt(total);
    $('fp').textContent=total?'100.00':'0.00';
    var th=$('theory'); th.style.bottom=((100/6)/scale*100)+'%';
    ylabs.forEach(function(el,k){var v=scale*k/4;el.style.bottom=(k*25)+'%';el.textContent=(v%1?v.toFixed(1):v)+'%';});
  }

  /* ---------- Three.js scene ---------- */
  var stage=$('stage');
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(34,1,0.1,50);
  camera.position.set(0,6.4,5.4); camera.lookAt(0,0.4,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.75));
  var sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(3,8,4); scene.add(sun);

  function faceTex(n){
    var c=document.createElement('canvas'); c.width=c.height=256; var g=c.getContext('2d');
    var gr=g.createLinearGradient(0,0,256,256); gr.addColorStop(0,'#fbf8ef'); gr.addColorStop(1,'#e9e3d2');
    g.fillStyle=gr; g.fillRect(0,0,256,256);
    g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=14; g.strokeRect(0,0,256,256);
    var a=64,b=128,d=192, P={
      1:[[b,b]],2:[[a,a],[d,d]],3:[[a,a],[b,b],[d,d]],4:[[a,a],[d,a],[a,d],[d,d]],
      5:[[a,a],[d,a],[b,b],[a,d],[d,d]],6:[[a,a],[d,a],[a,b],[d,b],[a,d],[d,d]]}[n];
    g.fillStyle=n===1?'#c8301f':'#1c1c1c';
    P.forEach(function(p){g.beginPath();g.arc(p[0],p[1],n===1?30:22,0,Math.PI*2);g.fill();});
    var t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
  }
  // BoxGeometry face order: +x, -x, +y, -y, +z, -z (opposite faces sum to 7)
  var faceVal=[3,4,1,6,2,5];
  var normals={3:[1,0,0],4:[-1,0,0],1:[0,1,0],6:[0,-1,0],2:[0,0,1],5:[0,0,-1]};
  var mats=faceVal.map(function(v){return new THREE.MeshPhongMaterial({map:faceTex(v),shininess:50})});
  var dice=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6),mats);
  scene.add(dice);
  var edges=new THREE.LineSegments(new THREE.EdgesGeometry(dice.geometry),new THREE.LineBasicMaterial({color:0x8a8473,transparent:true,opacity:.5}));
  dice.add(edges);

  // soft shadow
  var sc=document.createElement('canvas'); sc.width=sc.height=128; var sg=sc.getContext('2d');
  var rg=sg.createRadialGradient(64,64,6,64,64,62); rg.addColorStop(0,'rgba(0,0,0,.55)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  sg.fillStyle=rg; sg.fillRect(0,0,128,128);
  var shadow=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=-0.8; scene.add(shadow);

  function resize(){
    var w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
  resize();

  // start with 1 on top
  dice.quaternion.setFromAxisAngle(new THREE.Vector3(0,1,0),0.5);

  function targetQuat(v){
    var n=normals[v];
    var q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(n[0],n[1],n[2]),new THREE.Vector3(0,1,0));
    var yaw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*Math.PI*2);
    return yaw.multiply(q);
  }

  var anim=null;
  function setProg(done,n){
    var pct=n?Math.round(done*100/n):0;
    $('pf').style.width=pct+'%'; $('prog').setAttribute('aria-valuenow',pct);
    $('pp').textContent=pct+'%';
    $('pt').textContent=n?(fmt(done)+' / '+fmt(n)+'회 진행'):'대기 중';
  }
  function startAnim(result,dur){
    anim={t0:performance.now(),dur:dur,
      prev:dice.quaternion.clone(), target:targetQuat(result),
      axis:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),
      spins:Math.max(2,Math.round(dur/450)), h:1.5+Math.random()*.6, bounces:dur>1500?5:3};
  }
  var qs=new THREE.Quaternion(), qm=new THREE.Quaternion();
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now){
    requestAnimationFrame(frame);
    if(anim){
      var p=Math.min(1,(now-anim.t0)/anim.dur), e=1-Math.pow(1-p,3);
      var ang=reduce?0:(1-e)*anim.spins*Math.PI*2;
      qm.copy(anim.prev).slerp(anim.target,e);
      qs.setFromAxisAngle(anim.axis,ang);
      dice.quaternion.copy(qs).multiply(qm);
      var y=reduce?0:anim.h*Math.pow(1-p,1.6)*Math.abs(Math.sin(p*Math.PI*anim.bounces));
      dice.position.y=y;
      dice.position.x=Math.sin(p*Math.PI*2)*0.25*(1-p);
      var s=1-Math.min(.5,y/5); shadow.scale.set(s,s,s); shadow.material.opacity=.5+.5*s; shadow.position.x=dice.position.x;
      if(p>=1){dice.position.set(0,0,0);shadow.scale.set(1,1,1);shadow.position.x=0;anim=null;}
    }
    if(job){
      var jp=Math.min(1,(now-job.t0)/job.dur), n=job.res.length;
      var tgt=jp>=1?n:Math.floor(jp*n), changed=false;
      while(job.done<tgt){counts[job.res[job.done]-1]++;total++;job.done++;changed=true;}
      if(changed) render();
      setProg(job.done,n);
      if(jp>=1){
        $('last').textContent=job.res[n-1];
        $('msg').textContent=fmt(n)+'회 실행 완료 — 누적 '+fmt(total)+'회';
        job=null; setBusy(false);
      } else if(n===1||jp<1) { $('last').textContent='…'; }
    }
    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);

  /* ---------- Controls ---------- */
  var btns=['b1','b10','b100','bn'].map($);
  function setBusy(b){btns.forEach(function(el){el.disabled=b});$('n').disabled=b;}

  function run(n){
    if(job) return;
    var res=new Array(n);
    for(var i=0;i<n;i++) res[i]=1+Math.floor(Math.random()*6);
    var dur=n===1?1300:(n<=10?1800:2400);
    setBusy(true);
    $('msg').textContent=fmt(n)+'회 굴리는 중…';
    setProg(0,n);
    startAnim(res[n-1],dur);
    job={res:res,done:0,t0:performance.now(),dur:dur};
  }
  $('b1').onclick=function(){run(1)};
  $('b10').onclick=function(){run(10)};
  $('b100').onclick=function(){run(100)};
  $('bn').onclick=function(){
    var v=parseInt($('n').value,10);
    if(!(v>=1&&v<=100000)){$('msg').textContent='1에서 100,000 사이의 정수를 입력해 주세요.';$('n').focus();return;}
    run(v);
  };
  $('n').addEventListener('keydown',function(e){if(e.key==='Enter')$('bn').click();});
  $('reset').onclick=function(){
    job=null; anim=null; counts=[0,0,0,0,0,0]; total=0;
    dice.position.set(0,0,0); shadow.scale.set(1,1,1);
    dice.quaternion.setFromAxisAngle(new THREE.Vector3(0,1,0),0.5);
    $('last').textContent='–'; setBusy(false); render(); setProg(0,0);
    $('msg').textContent='기록을 모두 지웠습니다. 다시 실험해 보세요.';
  };
  render();
})();
</script>
</body>
</html>
